# SONARE CRM — ambiente completo (app + PostgreSQL local)
# Para usar banco gerenciado (Supabase), suba apenas o serviço `app`
# apontando DATABASE_URL para o banco remoto.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: sonare_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonare -d sonare_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sonare:${POSTGRES_PASSWORD}@db:5432/sonare_crm
      DIRECT_URL: postgresql://sonare:${POSTGRES_PASSWORD}@db:5432/sonare_crm
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /data/storage
    volumes:
      - storage:/data/storage
    ports:
      - "3000:3000"

volumes:
  pgdata:
  storage:
